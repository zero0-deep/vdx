<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu | Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 10px;
        }

        h1 { font-size: 20px; margin-bottom: 5px; }
        .nickname { color: #38bdf8; font-size: 14px; margin-bottom: 25px; display: block; }

        /* ෆොටෝ එකක් ලෙස පෙන්වන Frame එක */
        .image-box {
            position: relative;
            width: 100%;
            height: 250px; /* ඔබට අවශ්‍ය උස මෙතැනින් වෙනස් කරන්න */
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Google Drive preview එකේ අනවශ්‍ය දේවල් වසා දැමීම (No Zoom effect) */
        .image-box iframe {
            position: absolute;
            top: -50px; /* උඩ තීරුව ඉවත් කිරීමට */
            left: 0;
            width: 100%;
            height: calc(100% + 100px); /* සම්පූර්ණයෙන් පිරවීමට */
            border: none;
            pointer-events: none; /* User ට zoom කිරීම වැලැක්වීමට */
        }

        /* Overlay එකක් දැමීම මගින් ඇල්ලීමට නොහැකි කිරීම */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
        }

        .label {
            display: block;
            text-align: left;
            font-size: 11px;
            color: #94a3b8;
            margin: 0 0 8px 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 20px;
            font-size: 9px;
            opacity: 0.4;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="0454867b-cb5a-47de-a42e-f5f08cde18a8.jpg" alt="Netharu" class="profile-img">
        <h1>Netharu</h1>
        <span class="nickname">Platina Puncha</span>

        <span class="label">Photo 01</span>
        <div class="image-box">
            <div class="overlay"></div>
            <iframe src="https://drive.google.com/file/d/1ZpL7GpQjahn-NLe0MC0U4BrpNGcfShIt/preview"></iframe>
        </div>

        <span class="label">Photo 02</span>
        <div class="image-box">
            <div class="overlay"></div>
            <iframe src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview"></iframe>
        </div>

        <span class="label">Photo 03</span>
        <div class="image-box">
            <div class="overlay"></div>
            <iframe src="https://drive.google.com/file/d/1o8Hefqpq7Uggoofd5DCrcSSI0ZMzukgl/preview"></iframe>
        </div>

        <p class="footer">CREATION BY SUBHASH</p>
    </div>

</body>
</html>
