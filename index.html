<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu | Platina Puncha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: white;
        }

        /* Glassmorphism Card */
        .main-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        h1 { font-size: 24px; margin-bottom: 5px; }
        .nickname { color: #38bdf8; font-size: 16px; margin-bottom: 25px; display: block; }

        /* YouTube Style Video Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16 / 9; /* YouTube ratio */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        /* Mobile Adjustments */
        @media (max-width: 400px) {
            .main-card { padding: 15px; }
            .profile-img { width: 110px; height: 110px; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img src="0454867b-cb5a-47de-a42e-f5f08cde18a8.jpg" alt="Netharu" class="profile-img">
        
        <h1>Netharu</h1>
        <span class="nickname">Platina Puncha</span>

        <div class="video-wrapper">
            <iframe 
                src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" 
                allow="autoplay; fullscreen; picture-in-picture" 
                allowfullscreen>
            </iframe>
            
            <iframe 
                src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" 
                allow="autoplay; fullscreen; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <p class="footer">POWERED BY SUBHASH</p>
    </div>

</body>
</html>
