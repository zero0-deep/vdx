<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu | Platina Puncha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0f172a; /* Dark background */
            color: white;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 500px; /* ෆෝන් එකට ගැලපෙන උපරිම පළල */
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #38bdf8;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 { font-size: 24px; margin-bottom: 5px; }
        p.sub { color: #38bdf8; margin-bottom: 25px; font-weight: bold; }

        /* වීඩියෝ එක ෆෝන් එකට හදන කොටස */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 අනුපාතය පවත්වා ගැනීමට */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .label {
            display: block;
            text-align: left;
            margin-bottom: 10px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <img src="1000238454.jpg" alt="Netharu" class="profile-img">
        
        <h1>නෙතරු</h1>
        <p class="sub">Platina Puncha</p>

        <span class="label">:</span>
        <div class="video-container">
            <iframe 
                src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" 
                allow="autoplay" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
