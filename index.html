<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu | Platina Puncha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px; /* පිටතින් පොඩි ඉඩක් */
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 20px 15px; /* දෙපැත්තෙන් ඉඩ තැබුවා */
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        h1 { font-size: 22px; margin-bottom: 2px; }
        .nickname { color: #38bdf8; font-size: 15px; margin-bottom: 20px; display: block; }

        .video-label {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #94a3b8;
            margin: 15px 10px 8px 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* වීඩියෝව පෝන් එකට ගැලපෙන සහ බොත්තම් එබීමට පහසු වන ලෙස සකස් කිරීම */
        .video-wrapper {
            position: relative;
            width: 95%; /* 100% වෙනුවට 95% කර දෙපැත්තෙන් ඉඩ තැබුවා */
            margin: 0 auto 20px auto; /* මැදට ගත්තා */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            margin-top: 15px;
            font-size: 10px;
            opacity: 0.4;
            letter-spacing: 1px;
        }

        /* පෝන් එක කුඩා වෙද්දී තවත් පහසු කිරීමට */
        @media (max-width: 380px) {
            .container { padding: 15px 10px; }
            .video-wrapper { width: 98%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="0454867b-cb5a-47de-a42e-f5f08cde18a8.jpg" alt="Netharu" class="profile-img">
        
        <h1>Netharu</h1>
        <span class="nickname">Platina Puncha</span>

        <span class="video-label">Video 01</span>
        <div class="video-wrapper">
            <iframe 
                src="https://drive.google.com/file/d/1ZpL7GpQjahn-NLe0MC0U4BrpNGcfShIt/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen="true">
            </iframe>
        </div>

        <span class="video-label">Video 02</span>
        <div class="video-wrapper">
            <iframe 
                src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen="true">
            </iframe>
            
        </div>
             <iframe
                src="https://drive.google.com/file/d/1o8Hefqpq7Uggoofd5DCrcSSI0ZMzukgl/preview" width="390" height="300">
            </iframe>

        <p class="footer">CREATION BY SUBHASH</p>
    </div>

</body>
</html>
