<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu Pancha</title>
    <style>
        /* මුළු පිටුවේම පෙනුම */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 { color: #333; margin-bottom: 30px; }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        /* Card එකක සැලැස්ම */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card iframe, .card img {
            width: 100%;
            height: 200px;
            border: none;
            display: block;
        }

        .card-title {
            padding: 15px;
            font-weight: bold;
            color: #444;
            background: #fff;
        }

        .section-title {
            font-size: 24px;
            margin: 20px 0;
            color: #007bff;
            border-bottom: 2px solid #007bff;
            display: inline-block;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <h1>Gallery</h1>

    <div class="container">
        
        <div class="section-title">Video</div>
        <div class="card-container">
            <div class="card">
                <iframe src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview"></iframe>
                <div class="card-title">01</div>
            </div>

            <div class="card">
                <iframe src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview"></iframe>
                <div class="card-title">02</div>
            </div>
        </div>

        <div class="section-title">Photos</div>
        <div class="card-container">
            <div class="card">
                <img src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" alt="Photo 1">
                <div class="card-title">01</div>
            </div>

            <div class="card">
                <img src="https://drive.google.com/file/d/1SAyCtC7fk6N3MSpyJDF-LwYkKlcifdAU/preview" alt="Photo 2">
                <div class="card-title">02</div>
            </div>

            <div class="card">
                <img src="https://drive.google.com/file/d/1USWVE1o3OLhkY2NBcLvnd_uG1o-EhK9o/preview" alt="Photo 3">
                <div class="card-title">03</div>
            </div>
        </div>

    </div>

</body>
</html>
