<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu | Platina පුංචා</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f172a; /* තද නිල් පැහැති පසුබිම */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: #1e293b;
            width: 100%;
            max-width: 500px;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #38bdf8;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            color: #f8fafc;
        }

        .nickname {
            color: #38bdf8;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Responsive Video Container - ෆෝන් එකට ගැලපෙනම කොටස */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 අනුපාතය */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #94a3b8;
            text-align: left;
            padding-left: 5px;
        }

        .footer-text {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="0454867b-cb5a-47de-a42e-f5f08cde18a8.jpg" alt="Netharu" class="profile-img">
        
        <h1>නෙතරු</h1>
        <div class="nickname">Platina පුංචා</div>

        <span class="video-label">Watch My Video:</span>
        <div class="video-container">
            <iframe src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" allow="autoplay" allowfullscreen></iframe>
        </div>

        <div class="footer-text">© 2024 Platina Creation</div>
    </div>

</body>
</html>
