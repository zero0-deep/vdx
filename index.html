<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu | Platina Puncha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        /* Glass Card Container */
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 25px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #38bdf8;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        h1 { font-size: 24px; margin-bottom: 2px; color: #f8fafc; }
        .nickname { color: #38bdf8; font-size: 15px; margin-bottom: 25px; display: block; font-weight: 500; }

        /* Video Section */
        .video-label {
            display: block;
            text-align: left;
            font-size: 14px;
            color: #94a3b8;
            margin: 15px 0 8px 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            margin-bottom: 20px; /* වීඩියෝ දෙක අතර පරතරය */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            margin-top: 15px;
            font-size: 11px;
            opacity: 0.4;
        }

        /* Mobile Adjustments */
        @media (max-width: 450px) {
            .container { padding: 15px; }
            .profile-img { width: 100px; height: 100px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="1000238454.jpg" alt="Netharu" class="profile-img">
        
        <h1>නෙතරු</h1>
        <span class="nickname">Platina Puncha</span>

        <span class="video-label">Video 01</span>
        <div class="video-wrapper">
            <iframe 
                src="https://drive.google.com/file/d/1ZpL7GpQjahn-NLe0MC0U4BrpNGcfShIt/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <span class="video-label">Video 02</span>
        <div class="video-wrapper">
            <iframe 
                src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <p class="footer">CREATION BY PLATINA</p>
    </div>

</body>
</html>
