<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netharu | Platina Puncha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* ලස්සන Gradient පසුබිමක් */
            background: linear-gradient(45deg, #0f172a, #1e293b, #334155);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        /* Glass Interface එක */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); /* වීදුරු පෙනුම ලබා දෙන කොටස */
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .nickname {
            color: #38bdf8;
            font-weight: 500;
            margin-bottom: 30px;
            display: block;
        }

        /* වීඩියෝව සඳහා Responsive Container එක */
        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            opacity: 0.6;
        }

        /* Mobile එකට කුඩාවට පෙන්වීමට */
        @media (max-width: 480px) {
            .glass-card {
                padding: 20px;
            }
            h1 { font-size: 1.5rem; }
            .profile-img { width: 130px; height: 130px; }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <img src="0454867b-cb5a-47de-a42e-f5f08cde18a8.jpg" alt="Netharu" class="profile-img">
        
        <h1>නෙතරු</h1>
        <span class="nickname">Platina Puncha</span>

        <div class="video-box">
            <iframe 
                src="https://drive.google.com/file/d/1Jgy44z6HTuzoK4RjtB7oX-U-W8DBuC7O/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen="true">
            </iframe>
        </div>

        <p class="footer">Developed by Platina</p>
    </div>

</body>
</html>
